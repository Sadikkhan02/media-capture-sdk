<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Capture SDK — Video Editor Integration Demo</title>
  <link rel="stylesheet" href="../../dist/ui/styles.css" />
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #131b2e;
      --border: #222f4c;
      --primary: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    .badge {
      background: #1e3a8a;
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
    }
    .main-workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .left-capture-panel {
      width: 480px;
      padding: 20px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .right-editor-panel {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .editor-section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .media-bin {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 16px;
      min-height: 180px;
    }
    .media-card {
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
    }
    .media-card img, .media-card video {
      width: 100%;
      height: 110px;
      object-fit: cover;
      background: black;
    }
    .media-card-body {
      padding: 8px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .media-card-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .btn-sm {
      background: #334155;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-sm:hover { background: #475569; }
    .timeline-mock {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .track-row {
      height: 48px;
      background: #1a233a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      position: relative;
    }
    .track-label {
      width: 70px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .track-content {
      flex: 1;
      height: 36px;
      background: #0f172a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 2px;
      gap: 4px;
      overflow-x: auto;
    }
    .timeline-clip {
      height: 32px;
      background: #2563eb;
      color: white;
      font-size: 11px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      border-radius: 4px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Host Video Editor — Media Capture SDK Integration</h1>
    <span class="badge">SDK Demo</span>
  </header>

  <div class="main-workspace">
    <!-- SDK Capture Panel -->
    <div class="left-capture-panel">
      <div class="editor-section-title">Camera & Screen Capture</div>
      <div id="camera-widget-mount"></div>

      <div style="margin-top: 10px; display: flex; gap: 8px;">
        <button id="screen-capture-btn" class="btn-sm" style="padding: 8px 12px; flex: 1;">
          Record Screen / Tab
        </button>
      </div>
    </div>

    <!-- Host Application Video Editor Panel -->
    <div class="right-editor-panel">
      <div class="editor-section-title">Host Application Media Pool (Imported Items)</div>
      <div class="media-bin" id="media-bin">
        <div id="empty-state" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px 0;">
          No media captured yet. Use the camera controls on the left to capture a photo or record a video.
        </div>
      </div>

      <div class="editor-section-title">Timeline Simulation</div>
      <div class="timeline-mock">
        <div class="track-row">
          <div class="track-label">Video 1</div>
          <div class="track-content" id="v1-track"></div>
        </div>
        <div class="track-row">
          <div class="track-label">Audio 1</div>
          <div class="track-content" id="a1-track"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
